name: Build Turnip 26.2.2 MSM A740

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            python3 \
            python3-venv \
            ninja-build \
            ccache \
            flex \
            bison \
            pkg-config \
            patchelf \
            glslang-tools \
            clang \
            llvm \
            lld

      - name: Prepare Python environment
        run: |
          python3 -m venv "$HOME/mesa-venv"
          "$HOME/mesa-venv/bin/pip" install --upgrade pip
          "$HOME/mesa-venv/bin/pip" install meson mako

          echo "$HOME/mesa-venv/bin" >> "$GITHUB_PATH"

      - name: Download Android NDK r29
        run: |
          cd "$HOME"

          curl -L \
            "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" \
            -o android-ndk-r29-linux.zip

          unzip -q android-ndk-r29-linux.zip

          test -x \
            "$HOME/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang"

      - name: Clone Mesa 26.2.2
        run: |
          git clone \
            --depth 1 \
            --branch mesa-26.2.2 \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$HOME/mesa"

          cd "$HOME/mesa"

          echo "Mesa commit:"
          git rev-parse HEAD
          git describe --tags --always

      - name: Verify A740 fixes
        run: |
          cd "$HOME/mesa"

          FILE="src/freedreno/common/freedreno_devices.py"

          echo "=== A740 PC_MODE_CNTL ==="

          grep -A80 \
            'a740_raw_magic_regs = \[' \
            "$FILE" | \
            grep -m1 \
            'REG_A6XX_PC_MODE_CNTL'

          if ! grep -A80 \
              'a740_raw_magic_regs = \[' \
              "$FILE" | \
              grep -q \
              'REG_A6XX_PC_MODE_CNTL, 0x1f1f'; then

            echo "ERRO: Mesa 26.2.2 não contém PC_MODE_CNTL 0x1f1f para A740."
            exit 1
          fi

          echo
          echo "=== A740 implicit fragface/fragcoord ==="

          grep -A40 \
            'a7xx_740 = A7XXProps' \
            "$FILE" | \
            grep \
            'has_implicit_fragface_fragcoord_ij_linear' || true

          echo
          echo "A740 PC_MODE_CNTL 0x1f1f confirmado."

      - name: Apply Android NDK compatibility adjustments
        run: |
          cd "$HOME/mesa"

          if [ -f include/android_stub/cutils/native_handle.h ]; then
            sed -i \
              's/typedef const native_handle_t\* buffer_handle_t;/typedef void\* buffer_handle_t;/g' \
              include/android_stub/cutils/native_handle.h
          fi

          if [ -f src/util/u_gralloc/u_gralloc_fallback.c ]; then
            sed -i \
              's/, hnd->handle/, (void \*)hnd->handle/g' \
              src/util/u_gralloc/u_gralloc_fallback.c
          fi

          if [ -f src/vulkan/runtime/vk_android.c ]; then
            sed -i \
              's/native_buffer->handle->/((const native_handle_t \*)native_buffer->handle)->/g' \
              src/vulkan/runtime/vk_android.c

            sed -i \
              's/anb->handle->/((const native_handle_t \*)anb->handle)->/g' \
              src/vulkan/runtime/vk_android.c
          fi

      - name: Create Android ARM64 cross file
        run: |
          NDK="$HOME/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cat > "$HOME/mesa/android-aarch64.txt" <<EOF
          [binaries]
          ar = '$NDK/llvm-ar'
          c = ['ccache', '$NDK/aarch64-linux-android36-clang']
          cpp = ['ccache', '$NDK/aarch64-linux-android36-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$NDK/ld.lld'
          cpp_ld = '$NDK/ld.lld'
          strip = '$NDK/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=$NDK/pkg-config', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat > "$HOME/mesa/native.txt" <<EOF
          [binaries]
          c = ['ccache', 'clang']
          cpp = ['ccache', 'clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure Turnip MSM build
        run: |
          cd "$HOME/mesa"

          meson setup build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --native-file native.txt \
            --prefix /tmp/turnip-msm \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=36 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm \
            -Dallow-fallback-for=libdrm \
            -Dvideo-codecs= \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dopengl=false \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dvulkan-beta=true \
            -Dandroid-libbacktrace=disabled \
            -Dbuild-tests=false \
            -Dllvm=disabled

      - name: Build
        run: |
          cd "$HOME/mesa"

          ninja -C build-android-aarch64 -j"$(nproc)"
          ninja -C build-android-aarch64 install

      - name: Locate and verify driver
        run: |
          DRIVER="$(find /tmp/turnip-msm \
            -type f \
            -name 'libvulkan_freedreno.so' \
            -print -quit)"

          if [ -z "$DRIVER" ]; then
            echo "ERRO: libvulkan_freedreno.so não foi gerado."
            find /tmp/turnip-msm -type f
            exit 1
          fi

          echo "Driver: $DRIVER"

          ls -lh "$DRIVER"
          file "$DRIVER"

          echo
          echo "=== ELF dependencies ==="
          readelf -d "$DRIVER" | grep NEEDED || true

          echo
          echo "=== SHA256 ==="
          sha256sum "$DRIVER"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$DRIVER" \
            "$GITHUB_WORKSPACE/dist/libvulkan_freedreno.so"

      - name: Package driver
        run: |
          cd "$GITHUB_WORKSPACE/dist"

          cat > meta.json <<'EOF'
          {
            "schemaVersion": 1,
            "name": "Mesa Turnip 26.2.2 MSM A740",
            "description": "Mesa 26.2.2 Turnip built for Android ARM64 using the MSM/DRM KMD. Includes upstream A740 PC_MODE_CNTL 0x1f1f fix.",
            "author": "HugareBR",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Mesa 26.2.2 MSM A740",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          zip -9 \
            turnip-26.2.2-msm-a740.zip \
            libvulkan_freedreno.so \
            meta.json

          echo
          echo "=== OUTPUT ==="
          ls -lh

          echo
          sha256sum \
            libvulkan_freedreno.so \
            turnip-26.2.2-msm-a740.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-26.2.2-msm-a740
          path: |
            dist/libvulkan_freedreno.so
            dist/meta.json
            dist/turnip-26.2.2-msm-a740.zip
          if-no-files-found: error
