name: Build Turnip 26.2.2 MSM A740

on:
  workflow_dispatch:

env:
  NDK_VERSION: android-ndk-r29
  ANDROID_API: "34"
  MESA_TAG: mesa-26.2.2

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip \
            python3 python3-venv \
            ninja-build ccache \
            flex bison pkg-config \
            patchelf glslang-tools \
            clang llvm lld \
            binutils file

      - name: Prepare Python
        run: |
          set -euxo pipefail

          python3 -m venv "$HOME/mesa-venv"
          "$HOME/mesa-venv/bin/pip" install --upgrade pip
          "$HOME/mesa-venv/bin/pip" install \
            meson \
            mako \
            packaging \
            PyYAML

          echo "$HOME/mesa-venv/bin" >> "$GITHUB_PATH"

      - name: Download Android NDK r29
        run: |
          set -euxo pipefail

          cd "$HOME"

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/${NDK_VERSION}-linux.zip" \
            -o ndk.zip

          unzip -q ndk.zip

          NDKBIN="$HOME/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$NDKBIN/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$NDKBIN/aarch64-linux-android${ANDROID_API}-clang++"

          "$NDKBIN/aarch64-linux-android${ANDROID_API}-clang" --version

      - name: Clone Mesa 26.2.2
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "$MESA_TAG" \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            "$HOME/mesa"

          cd "$HOME/mesa"

          git rev-parse HEAD
          git describe --tags --always

      - name: Verify A740 fix
        run: |
          set -euxo pipefail

          cd "$HOME/mesa"

          FILE="src/freedreno/common/freedreno_devices.py"

          test -f "$FILE"

          echo "=== A740 block ==="

          grep -n -A30 "a740_raw_magic_regs = \[" "$FILE" | head -35

          echo
          echo "=== Checking PC_MODE_CNTL ==="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("src/freedreno/common/freedreno_devices.py")
          text = path.read_text()

          match = re.search(
              r"^a740_raw_magic_regs\s*=\s*\[(.*?)^\s*\]",
              text,
              re.MULTILINE | re.DOTALL,
          )

          if not match:
              raise SystemExit(
                  "ERRO: bloco a740_raw_magic_regs não encontrado"
              )

          block = match.group(1)

          if not re.search(
              r"REG_A6XX_PC_MODE_CNTL\s*,\s*0x0*1f1f",
              block,
          ):
              raise SystemExit(
                  "ERRO: PC_MODE_CNTL 0x1f1f não encontrado no A740"
              )

          print("OK: A740 PC_MODE_CNTL = 0x1f1f")
          PY

      - name: Apply NDK r29 compatibility fixes
        run: |
          set -euxo pipefail

          cd "$HOME/mesa"

          echo "Applying buffer_handle_t fix..."

          sed -i \
            's/typedef const native_handle_t\* buffer_handle_t;/typedef void* buffer_handle_t;/g' \
            include/android_stub/cutils/native_handle.h

          echo "Applying u_gralloc fix..."

          sed -i \
            's/, hnd->handle/, (void *)hnd->handle/g' \
            src/util/u_gralloc/u_gralloc_fallback.c

          echo "Applying vk_android fixes..."

          sed -i \
            's/native_buffer->handle->/((const native_handle_t *)native_buffer->handle)->/g' \
            src/vulkan/runtime/vk_android.c

          sed -i \
            's/anb->handle->/((const native_handle_t *)anb->handle)->/g' \
            src/vulkan/runtime/vk_android.c

          echo
          echo "=== Applied changes ==="
          git diff -- \
            include/android_stub/cutils/native_handle.h \
            src/util/u_gralloc/u_gralloc_fallback.c \
            src/vulkan/runtime/vk_android.c

          git diff --check

      - name: Create cross files
        run: |
          set -euxo pipefail

          NDKBIN="$HOME/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cat > "$HOME/mesa/android-aarch64.txt" <<EOF
          [binaries]
          ar = '$NDKBIN/llvm-ar'
          c = ['ccache', '$NDKBIN/aarch64-linux-android${ANDROID_API}-clang']
          cpp = ['ccache', '$NDKBIN/aarch64-linux-android${ANDROID_API}-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$NDKBIN/ld.lld'
          cpp_ld = '$NDKBIN/ld.lld'
          strip = '$NDKBIN/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          cat > "$HOME/mesa/native.txt" <<'EOF'
          [binaries]
          c = ['ccache', 'clang']
          cpp = ['ccache', 'clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure Turnip MSM
        run: |
          set -euxo pipefail

          cd "$HOME/mesa"

          meson setup build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --native-file native.txt \
            --prefix /tmp/turnip-msm \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version="${ANDROID_API}" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dvideo-codecs= \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=msm \
            -Dallow-fallback-for=libdrm \
            -Degl=disabled \
            -Dllvm=disabled

      - name: Build
        run: |
          set -euxo pipefail

          cd "$HOME/mesa"

          ninja -C build-android-aarch64 -j"$(nproc)"
          ninja -C build-android-aarch64 install

      - name: Verify driver
        run: |
          set -euxo pipefail

          DRIVER="$(find /tmp/turnip-msm \
            -type f \
            -name libvulkan_freedreno.so \
            -print -quit)"

          test -n "$DRIVER"
          test -s "$DRIVER"

          echo "================================"
          echo "DRIVER=$DRIVER"
          echo "================================"

          ls -lh "$DRIVER"
          file "$DRIVER"

          echo
          echo "=== ELF MACHINE ==="
          readelf -h "$DRIVER" | grep -E 'Class:|Machine:|Type:'

          echo
          echo "=== ELF NEEDED ==="
          readelf -d "$DRIVER" | grep NEEDED || true

          echo
          echo "=== SHA256 ==="
          sha256sum "$DRIVER"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$DRIVER" "$GITHUB_WORKSPACE/dist/libvulkan_freedreno.so"

      - name: Package
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/dist"

          cat > meta.json <<'EOF'
          {
            "schemaVersion": 1,
            "name": "Mesa Turnip 26.2.2 MSM A740",
            "description": "Mesa 26.2.2 Turnip for Android ARM64 / MSM DRM. A740 upstream PC_MODE_CNTL 0x1f1f.",
            "author": "HugareBR",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Mesa 26.2.2 MSM",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          zip -9 \
            turnip-26.2.2-msm-a740.zip \
            libvulkan_freedreno.so \
            meta.json

          ls -lh

          sha256sum \
            libvulkan_freedreno.so \
            turnip-26.2.2-msm-a740.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-26.2.2-msm-a740
          path: |
            dist/libvulkan_freedreno.so
            dist/meta.json
            dist/turnip-26.2.2-msm-a740.zip
          if-no-files-found: error
