name: Build Xenia Edge Linux ARM64

on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            git \
            curl \
            wget \
            pkg-config \
            clang-21 \
            llvm-21 \
            lld-21 \
            libc++-21-dev \
            libc++abi-21-dev \
            liblz4-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-xcb-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdbus-1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libxkbcommon-dev \
            libxfixes-dev

      - name: Clone Xenia Edge
        run: |
          git clone \
            --branch edge \
            --recursive \
            https://github.com/has207/xenia-edge.git \
            xenia-edge

          cd xenia-edge

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "=== ROOT FILES ==="
          ls -lah

          echo
          echo "=== XB ==="
          ls -l xb xenia-build.py

      - name: Show compiler versions
        run: |
          uname -m
          clang-21 --version
          clang++-21 --version
          cmake --version
          ninja --version

      - name: Download Slang compiler
        working-directory: xenia-edge
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          ./xb slang

      - name: Configure Xenia
        working-directory: xenia-edge
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          ./xb setup

      - name: Build Release ARM64
        working-directory: xenia-edge
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          ./xb build --config=release

      - name: Inspect output
        working-directory: xenia-edge
        run: |
          echo "=== BUILD OUTPUT ==="
          find build -type f -executable -print -exec file {} \; || true

          echo
          echo "=== BIN ==="
          find build/bin -maxdepth 4 -type f -print || true

      - name: Package
        run: |
          mkdir -p artifact/Xenia-Edge-Linux-ARM64

          cp -a \
            xenia-edge/build/bin/Linux/Release/. \
            artifact/Xenia-Edge-Linux-ARM64/

          echo "=== PACKAGE CONTENT ==="
          find artifact/Xenia-Edge-Linux-ARM64 \
            -maxdepth 2 \
            -type f \
            -print

          tar -C artifact \
            -cJf artifact/Xenia-Edge-Linux-ARM64.tar.xz \
            Xenia-Edge-Linux-ARM64

          ls -lh artifact/Xenia-Edge-Linux-ARM64.tar.xz

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: Xenia-Edge-Linux-ARM64
          path: artifact/Xenia-Edge-Linux-ARM64.tar.xz
          if-no-files-found: error
