name: Build Xenia Edge Linux ARM64

on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: build-linux-arm64
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            pkg-config \
            cmake \
            ninja-build \
            clang-21 \
            llvm-21 \
            lld-21 \
            libc++-21-dev \
            libc++abi-21-dev \
            liblz4-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libgtk-3-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdbus-1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libxkbcommon-dev \
            libxfixes-dev

      - name: Show compiler versions
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== ARCH ==="
          uname -m

          echo "=== CLANG ==="
          clang-21 --version
          clang++-21 --version

          echo "=== LLVM ==="
          llvm-config-21 --version

          echo "=== CMAKE ==="
          cmake --version

          echo "=== NINJA ==="
          ninja --version

          echo "=== PYTHON ==="
          python3 --version

      - name: Clone Xenia Edge
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --branch edge \
            --recursive \
            https://github.com/has207/xenia-edge.git \
            xenia-edge

          cd xenia-edge

          git submodule sync --recursive
          git submodule update --init --recursive

          echo
          echo "=== COMMIT ==="
          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=== XB ==="
          ls -lah xb xenia-build.py

      - name: Download Slang compiler
        working-directory: xenia-edge
        shell: bash
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          set -euxo pipefail

          ./xb slang

          echo
          echo "=== SLANG ==="
          find .slang -type f -name slangc -print -exec file {} \;

      - name: Configure Xenia
        working-directory: xenia-edge
        shell: bash
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          set -euxo pipefail

          ./xb setup

      - name: Build Release ARM64
        working-directory: xenia-edge
        shell: bash
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          set -euxo pipefail

          ./xb build --config=release

      - name: Inspect ARM64 build
        working-directory: xenia-edge
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== RELEASE DIRECTORY ==="
          ls -lah build/bin/Linux/Release/

          echo
          echo "=== FILE TYPES ==="
          find build/bin/Linux/Release \
            -maxdepth 1 \
            -type f \
            -exec file {} \;

          echo
          echo "=== ARM64 EXECUTABLES ==="
          find build/bin/Linux/Release \
            -maxdepth 1 \
            -type f \
            -executable \
            -print \
            -exec file {} \;

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifact/Xenia-Edge-Linux-ARM64

          cp -a \
            xenia-edge/build/bin/Linux/Release/. \
            artifact/Xenia-Edge-Linux-ARM64/

          echo
          echo "=== PACKAGE CONTENT ==="
          find artifact/Xenia-Edge-Linux-ARM64 \
            -maxdepth 2 \
            -type f \
            -print

          tar \
            -C artifact \
            -cJf artifact/Xenia-Edge-Linux-ARM64.tar.xz \
            Xenia-Edge-Linux-ARM64

          echo
          echo "=== FINAL ARCHIVE ==="
          ls -lh artifact/Xenia-Edge-Linux-ARM64.tar.xz

          sha256sum \
            artifact/Xenia-Edge-Linux-ARM64.tar.xz \
            > artifact/Xenia-Edge-Linux-ARM64.tar.xz.sha256

          cat artifact/Xenia-Edge-Linux-ARM64.tar.xz.sha256

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: Xenia-Edge-Linux-ARM64
          path: |
            artifact/Xenia-Edge-Linux-ARM64.tar.xz
            artifact/Xenia-Edge-Linux-ARM64.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
